name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          [ -z "$ZIP_FILE" ] && echo "Zip tidak ditemukan di root repo" && exit 1
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project root
        id: locate
        run: |
          set -e
          PROJECT_DIR=$(find extracted -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          [ -z "$PROJECT_DIR" ] && echo "settings.gradle.kts tidak ditemukan" && exit 1
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: ${{ steps.locate.outputs.project_dir }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cbt-smkn6garut-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
